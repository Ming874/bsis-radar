<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="自行車後方來車警示儀表板：以 Web Bluetooth 連線 ESP32 與 C4001 毫米波雷達" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Radar A 後方來車警示</title>
    <script>
      // 在畫面出現前先套用使用者選的深色 / 淺色，避免開啟時閃一下（設定存在 radarA.settings.v2）
      try {
        var theme = JSON.parse(localStorage.getItem('radarA.settings.v2') || '{}').theme || 'light';
        if (theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>這個網頁需要開啟 JavaScript 才能使用。</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
