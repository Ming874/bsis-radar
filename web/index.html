<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f3f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BSIS 測速" />
    <meta name="application-name" content="BSIS 測速" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="BSIS 對地測速：以 Web Bluetooth 連線 ESP32 與朝向路面的 C4001 24 GHz 毫米波雷達，即時顯示自行車對地速度、行程、校正與驗證" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>BSIS 測速</title>
    <style>
      /* 開場畫面：從主畫面打開 App 時接在系統的啟動畫面後面（同樣的藍底、同一個圖示），內容畫好就淡出（src/ui/App.tsx）。
         底色要和 manifest.json 的 background_color 一樣 */
      #launch { display: none; }
      [data-launch] #launch {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
        background: #1765e5; color: #fff; pointer-events: none;
        transition: opacity 0.3s ease;
      }
      #launch svg { width: 96px; height: 96px; display: block; }
      #launch p {
        margin: 0; font: 600 22px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif;
        letter-spacing: 0.02em; opacity: 0.95;
      }
      #launch small { display: block; margin-top: 6px; font-size: 13px; font-weight: 500; opacity: 0.75; text-align: center; }
      #launch.out { opacity: 0; }
      @media (prefers-reduced-motion: reduce) { #launch { transition: none; } }
    </style>
    <script>
      // 在畫面出現前先套用使用者選的主題（預設跟隨系統），避免開啟時閃一下；設定存在 bsis.settings.v1
      try {
        var theme = JSON.parse(localStorage.getItem('bsis.settings.v1') || '{}').theme || 'system';
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#000000' : '#f2f3f5');
      } catch (e) {}
      // 開場畫面：只在從主畫面打開 App 時出現；同一次開啟裡重新整理就不再出現
      try {
        var app = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        if (app && !sessionStorage.getItem('bsis.launched')) {
          sessionStorage.setItem('bsis.launched', '1');
          document.documentElement.setAttribute('data-launch', '');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>這個網頁需要開啟 JavaScript 才能使用。</noscript>
    <div id="root"></div>
    <div id="launch" aria-hidden="true">
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#ffffff" fill-opacity="0.14" />
        <path d="M136 344a136 136 0 1 1 240 0" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" />
        <path d="M256 264 336 176" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" />
        <circle cx="256" cy="264" r="26" fill="#ffffff" />
      </svg>
      <p>BSIS 測速<small>毫米波雷達對地測速</small></p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
